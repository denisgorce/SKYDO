plugins { id 'com.android.application' }
def ks = System.getenv('KEYSTORE_FILE')
android {
  namespace 'com.colonnes.app'
  compileSdk 34
  defaultConfig {
    applicationId 'com.colonnes.app'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }
  signingConfigs {
    release {
      if (ks) {
        storeFile file(ks)
        storePassword System.getenv('KEYSTORE_PASSWORD')
        keyAlias System.getenv('KEY_ALIAS')
        keyPassword System.getenv('KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig ks ? signingConfigs.release : signingConfigs.debug
    }
  }
  lint {
    checkReleaseBuilds false
    abortOnError false
  }
  compileOptions {
    encoding 'UTF-8'
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
