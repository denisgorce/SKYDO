name: Build APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Keystore (optionnel)
        env: { KS: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/ks.jks"; echo "KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.KEY_PASSWORD }}'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk Colonnes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Colonnes-apk
          path: Colonnes.apk
          if-no-files-found: error
      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: Colonnes.apk }
